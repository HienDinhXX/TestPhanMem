<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đấu Giá</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111; font-size: 11px; display: flex; flex-direction: column; overflow: hidden; }

    /* Header Tabs */
    header { display: flex; border-bottom: 1px solid #ccc; background: #f8f8f8; position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 8px 2px; border: none; background: none; font-size: 11px; font-weight: bold; color: #666; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #000; border-bottom: 2px solid #000; background: #fff; }

    .container { flex: 1; display: flex; flex-direction: column; padding: 4px; overflow: hidden; }
    .tab-content { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }

    /* Form Minimal */
    .form-box { display: flex; gap: 4px; padding: 4px; background: #f4f4f4; border-bottom: 1px solid #ddd; align-items: center; flex-shrink: 0; }
    .form-box input, .form-box select { width: 100%; height: 26px; font-size: 16px !important; transform: scale(0.6875); transform-origin: top left; width: 145.45%; padding: 2px 4px; border: 1px solid #aaa; border-radius: 2px; background: #fff; }
    .input-wrap { flex: 1; display: flex; flex-direction: column; }
    .input-wrap.small { flex: 0.8; }
    .input-wrap.large { flex: 1.2; }
    
    .btn-add { height: 26px; padding: 0 8px; background: #222; color: #fff; border: none; font-size: 11px; font-weight: bold; border-radius: 2px; cursor: pointer; white-space: nowrap; }
    .btn-edit { height: 26px; padding: 0 8px; background: #0066cc; color: #fff; border: none; font-size: 11px; font-weight: bold; border-radius: 2px; cursor: pointer; white-space: nowrap; }

    /* Section Header */
    .sec-title { font-size: 10px; font-weight: bold; color: #333; margin: 6px 0 2px 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }

    /* Tables */
    .table-wrap { width: 100%; flex: 1; overflow-x: auto; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; }
    th, td { padding: 3px 2px; border: 1px solid #ddd; text-align: right; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    th { background: #f0f0f0; color: #333; font-weight: bold; font-size: 9px; position: sticky; top: 0; z-index: 5; }
    th:first-child, td:first-child { text-align: center; }
    
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #e2e2e2; }

    /* Cell Inputs */
    .cell-input { width: 145.45%; height: 26px; font-size: 16px !important; transform: scale(0.6875); transform-origin: top left; padding: 0 2px; text-align: right; border: 1px solid #ccc; background: #fff; }
    .cell-input:focus { border-color: #000; }

    /* Column Widths */
    .t1-ma { width: 25%; text-align: center; font-weight: bold; }
    .t1-dt { width: 35%; }
    .t1-gia { width: 40%; }

    .t2-ma { width: 11%; text-align: center; font-weight: bold; }
    .t2-dt { width: 10%; }
    .t2-gkd { width: 13%; color: #555; }
    .t2-gv1 { width: 13%; }
    .t2-v1m2 { width: 13%; background: #f7f7f7; color: #0066cc; }
    .t2-gv2 { width: 13%; }
    .t2-v2m2 { width: 13%; background: #f7f7f7; color: #008844; }
    .t2-v3m2 { width: 14%; background: #fffbe6; color: #b8860b; font-weight: bold; }

    .bar { display: flex; justify-content: space-between; padding: 4px; font-size: 9px; color: #666; background: #f9f9f9; border-top: 1px solid #ddd; flex-shrink: 0; }
    .btn-text { background: none; border: none; color: #c00; font-size: 9px; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <button class="tab-btn active" onclick="switchTab('t1')">1. Thêm</button>
    <button class="tab-btn" onclick="switchTab('t2')">2. Đ G</button>
  </header>

  <div class="container">
    
    <!-- TAB 1 -->
    <div id="t1" class="tab-content active">
      <!-- Form Thêm Lô -->
      <form class="form-box" onsubmit="addLot(event)">
        <div class="input-wrap small">
          <input type="text" id="m" placeholder="Mã lô" required autocomplete="off">
        </div>
        <div class="input-wrap small">
          <input type="number" step="0.1" id="d" placeholder="m²" required>
        </div>
        <div class="input-wrap large">
          <input type="number" step="any" id="g" placeholder="Giá tổng (Triệu)" required>
        </div>
        <button type="submit" class="btn-add">Thêm</button>
      </form>

      <!-- Bảng Danh Sách -->
      <div class="table-wrap" style="margin-top:4px;">
        <table>
          <thead>
            <tr>
              <th class="t1-ma">Mã</th>
              <th class="t1-dt">Diện tích (m²)</th>
              <th class="t1-gia">Giá KĐ (Triệu)</th>
            </tr>
          </thead>
          <tbody id="tb1"></tbody>
        </table>
      </div>

      <!-- Phần Chọn & Chỉnh Sửa Bên Dưới Bảng -->
      <div class="sec-title">✏️ CHỈNH SỬA LÔ ĐẤT</div>
      <form class="form-box" onsubmit="editLot(event)" style="background: #eef6ff; border-color: #bbd7ff;">
        <div class="input-wrap small">
          <select id="edit-select" onchange="onSelectLotToEdit()">
            <option value="">-- Chọn mã --</option>
          </select>
        </div>
        <div class="input-wrap small">
          <input type="number" step="0.1" id="edit-d" placeholder="m²" required>
        </div>
        <div class="input-wrap large">
          <input type="number" step="any" id="edit-g" placeholder="Giá tổng (Triệu)" required>
        </div>
        <button type="submit" class="btn-edit">Lưu</button>
      </form>

      <div class="bar">
        <button class="btn-text" onclick="resetDefaultData()">Khôi phục dữ liệu gốc</button>
        <span id="cnt">0 lô</span>
      </div>
    </div>

    <!-- TAB 2 -->
    <div id="t2" class="tab-content">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="t2-ma">Mã</th>
              <th class="t2-dt sortable" onclick="toggleSort('dt')" id="th-dt" title="Sắp xếp theo diện tích">S ↕</th>
              <th class="t2-gkd sortable" onclick="toggleSort('kd')" id="th-kd" title="Sắp xếp theo giá khởi điểm">KĐ ↕</th>
              <th class="t2-gv1">V1</th>
              <th class="t2-v1m2">V1/m²</th>
              <th class="t2-gv2">V2</th>
              <th class="t2-v2m2">V2/m²</th>
              <th class="t2-v3m2">Ư.V3/m²</th>
            </tr>
          </thead>
          <tbody id="tb2"></tbody>
        </table>
      </div>
      <div class="bar">
        
        <button class="btn-text" onclick="exportCSV()" style="color:#0066cc;">Xuất CSV</button>
      </div>
    </div>

  </div>

    ];

    let lots = JSON.parse(localStorage.getItem('min_auction_lots_trieu_v3') || 'null');
    if (!lots) {
      lots = defaultLots;
      save();
    }

    // Quản lý trạng thái sắp xếp
    let sortColumn = null; // 'dt' | 'kd'
    let sortOrder = 'default'; // 'default' | 'asc' | 'desc'

    function save() {
      localStorage.setItem('min_auction_lots_trieu_v3', JSON.stringify(lots));
      document.getElementById('cnt').textContent = `${lots.length} lô`;
    }

    function switchTab(id) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if(id==='t1') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('t1').classList.add('active');
        renderT1();
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('t2').classList.add('active');
        renderT2();
      }
    }

    function addLot(e) {
      e.preventDefault();
      const m = document.getElementById('m').value.trim().toUpperCase();
      const d = parseFloat(document.getElementById('d').value);
      const g = parseFloat(document.getElementById('g').value);
      if(!m || !d || isNaN(g)) return;

      lots.unshift({
        id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
        ma: m, dt: d,
        kd: g,
        v1: 0, v2: 0
      });
      save();
      renderT1();
      document.getElementById('m').value = '';
      document.getElementById('d').value = '';
      document.getElementById('g').value = '';
      document.getElementById('m').focus();
    }

    function onSelectLotToEdit() {
      const id = document.getElementById('edit-select').value;
      const l = lots.find(item => item.id === id);
      if(l) {
        document.getElementById('edit-d').value = l.dt;
        document.getElementById('edit-g').value = l.kd;
      } else {
        document.getElementById('edit-d').value = '';
        document.getElementById('edit-g').value = '';
      }
    }

    function editLot(e) {
      e.preventDefault();
      const id = document.getElementById('edit-select').value;
      if(!id) {
        alert('Vui lòng chọn Mã lô cần sửa từ danh sách!');
        return;
      }
      const l = lots.find(item => item.id === id);
      if(l) {
        l.dt = parseFloat(document.getElementById('edit-d').value) || l.dt;
        l.kd = parseFloat(document.getElementById('edit-g').value) || l.kd;
        save();
        renderT1();
        alert(`Đã cập nhật xong lô ${l.ma}!`);
      }
    }

    function updateVal(id, field, val) {
      const l = lots.find(item => item.id === id);
      if(l) {
        l[field] = parseFloat(val) || 0;
        save();
        renderT2();
      }
    }

    function fGia(v) {
      if(!v) return '-';
      return v.toLocaleString('vi-VN');
    }

    function fM2(v, dt) {
      if(!v || !dt) return '-';
      return (v / dt).toFixed(2);
    }

    function toggleSort(col) {
      const thDt = document.getElementById('th-dt');
      const thKd = document.getElementById('th-kd');

      if (sortColumn !== col) {
        sortColumn = col;
        sortOrder = 'asc';
      } else {
        if (sortOrder === 'asc') sortOrder = 'desc';
        else if (sortOrder === 'desc') {
          sortOrder = 'default';
          sortColumn = null;
        }
      }

      // Cập nhật biểu tượng tiêu đề
      thDt.textContent = sortColumn === 'dt' ? (sortOrder === 'asc' ? 'S ▲' : (sortOrder === 'desc' ? 'S ▼' : 'S ↕')) : 'S ↕';
      thKd.textContent = sortColumn === 'kd' ? (sortOrder === 'asc' ? 'KĐ ▲' : (sortOrder === 'desc' ? 'KĐ ▼' : 'KĐ ↕')) : 'KĐ ↕';

      renderT2();
    }

    function renderT1() {
      const tb = document.getElementById('tb1');
      const sel = document.getElementById('edit-select');

      if(lots.length === 0) {
        tb.innerHTML = `<tr><td colspan="3" style="text-align:center;padding:10px;color:#777">Chưa có lô đất</td></tr>`;
        sel.innerHTML = `<option value="">-- Chưa có lô --</option>`;
        document.getElementById('edit-d').value = '';
        document.getElementById('edit-g').value = '';
        return;
      }

      tb.innerHTML = lots.map(l => `
        <tr>
          <td class="t1-ma">${l.ma}</td>
          <td style="text-align:right">${l.dt}</td>
          <td style="text-align:right">${fGia(l.kd)}</td>
        </tr>
      `).join('');

      const curSel = sel.value;
      sel.innerHTML = `<option value="">-- Chọn mã --</option>` + 
        lots.map(l => `<option value="${l.id}">${l.ma}</option>`).join('');
      sel.value = curSel;

      document.getElementById('cnt').textContent = `${lots.length} lô`;
    }

    function renderT2() {
      const tb = document.getElementById('tb2');
      if(lots.length === 0) {
        tb.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:10px;color:#777">Chưa có dữ liệu</td></tr>`;
        return;
      }

      let displayLots = [...lots];
      if (sortColumn && sortOrder !== 'default') {
        displayLots.sort((a, b) => {
          const valA = a[sortColumn];
          const valB = b[sortColumn];
          return sortOrder === 'asc' ? valA - valB : valB - valA;
        });
      }

      tb.innerHTML = displayLots.map(l => {
        const v1m2 = fM2(l.v1, l.dt);
        const v2m2 = fM2(l.v2, l.dt);
        let v3 = '-';
        
        if(l.v1 && l.v2 && l.dt) {
          const m1 = l.v1 / l.dt;
          const m2 = l.v2 / l.dt;
          v3 = (m2 + Math.max(m2 - m1, 0)).toFixed(2);
        } else if(l.v1 && l.dt) {
          v3 = (l.v1 / l.dt * 1.05).toFixed(2);
        }

        return `
          <tr>
            <td class="t2-ma">${l.ma}</td>
            <td style="text-align:right">${l.dt}</td>
            <td style="text-align:right">${fGia(l.kd)}</td>
            <td style="text-align:right">
              <input type="number" step="any" class="cell-input" value="${l.v1 ? l.v1 : ''}" placeholder="Triệu" onchange="updateVal('${l.id}','v1',this.value)">
            </td>
            <td class="t2-v1m2">${v1m2}</td>
            <td style="text-align:right">
              <input type="number" step="any" class="cell-input" value="${l.v2 ? l.v2 : ''}" placeholder="Triệu" onchange="updateVal('${l.id}','v2',this.value)">
            </td>
            <td class="t2-v2m2">${v2m2}</td>
            <td class="t2-v3m2">${v3}</td>
          </tr>
        `;
      }).join('');
    }

    function resetDefaultData() {
      if(confirm('Khôi phục lại toàn bộ dữ liệu gốc từ ảnh?')) {
        lots = JSON.parse(JSON.stringify(defaultLots));
        sortColumn = null;
        sortOrder = 'default';
        document.getElementById('th-dt').textContent = 'S ↕';
        document.getElementById('th-kd').textContent = 'KĐ ↕';
        save();
        renderT1();
        renderT2();
      }
    }

    function exportCSV() {
      let csv = '\uFEFFMã,Diện tích,Giá KĐ (Triệu),Vòng 1 (Triệu),V1/m2 (Triệu/m2),Vòng 2 (Triệu),V2/m2 (Triệu/m2)\n';
      lots.forEach(l => {
        csv += `${l.ma},${l.dt},${l.kd},${l.v1},${fM2(l.v1,l.dt)},${l.v2},${fM2(l.v2,l.dt)}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'daugia_trieu.csv';
      a.click();
    }

    renderT1();
  </script>
