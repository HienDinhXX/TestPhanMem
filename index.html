<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Quản Lý Ghi Nợ v2</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --background-color: #f3f4f6;
            --card-color: #ffffff;
            --text-color: #1f2937;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
            color: #374151;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }

        input:read-only {
            background-color: #f3f4f6;
            color: #4b5563;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #4338ca;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9rem;
        }

        th {
            background-color: #f8fafc;
            color: #4b5563;
            font-weight: 600;
        }

        /* Trạng thái */
        .status-badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            cursor: pointer;
            user-select: none;
        }

        .status-unpaid {
            background-color: #fef3c7;
            color: #d97706;
            border: 1px solid #fde68a;
        }

        .status-paid {
            background-color: #d1fae5;
            color: #059669;
            border: 1px solid #a7f3d0;
            text-decoration: line-through;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            color: white;
            font-weight: normal;
            width: auto;
        }

        .btn-status {
            background-color: #6b7280;
        }
        .btn-status:hover { background-color: #4b5563; }

        .btn-delete {
            background-color: #ef4444;
        }
        .btn-delete:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Quản Lý Sổ Nợ Cá Nhân</h1>
    
    <div class="grid">
        <!-- FORM NHẬP THÔNG TIN -->
        <div class="card">
            <h2>Thêm Khoản Nợ Mới</h2>
            <form id="debtForm">
                <div class="form-group">
                    <label for="borrowerName">Tên người vay:</label>
                    <input type="text" id="borrowerName" required placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                
                <div class="form-group">
                    <label for="loanAmount">Số tiền vay (VNĐ):</label>
                    <input type="number" id="loanAmount" required placeholder="Ví dụ: 10000000">
                </div>

                <div class="form-group">
                    <label for="interestRate">Lãi suất (% / năm):</label>
                    <input type="number" id="interestRate" step="0.01" required placeholder="Ví dụ: 5.5">
                </div>

                <div class="form-group">
                    <label for="loanDate">Ngày vay:</label>
                    <input type="date" id="loanDate" required>
                </div>

                <div class="form-group">
                    <label for="returnDate">Ngày dự kiến trả:</label>
                    <input type="date" id="returnDate" required>
                </div>

                <div class="form-group">
                    <label id="dayCountLabel" style="color: #6b7280; font-weight: normal; font-style: italic; margin-bottom: 10px;">Số ngày vay: 0 ngày</label>
                    <label for="totalExpected">Tổng số tiền dự kiến trả:</label>
                    <input type="text" id="totalExpected" readonly placeholder="Tự động tính toán...">
                </div>

                <button type="submit">Thêm Vào Sổ Nợ</button>
            </form>
        </div>

        <!-- DANH SÁCH SỔ NỢ -->
        <div class="card">
            <h2>Danh Sách Nợ</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Người vay</th>
                            <th>Ngày vay</th>
                            <th>Số tiền gốc</th>
                            <th>Lãi suất</th>
                            <th>Hạn trả (Số ngày)</th>
                            <th>Tổng dự kiến</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="debtTableBody">
                        <!-- Dữ liệu tự động thêm ở đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Hàm định dạng tiền tệ VND
    function formatVND(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    const loanAmountInput = document.getElementById('loanAmount');
    const interestRateInput = document.getElementById('interestRate');
    const loanDateInput = document.getElementById('loanDate');
    const returnDateInput = document.getElementById('returnDate');
    const totalExpectedInput = document.getElementById('totalExpected');
    const dayCountLabel = document.getElementById('dayCountLabel');

    // Hàm tự động tính toán tổng số tiền trả dựa trên số ngày vay thực tế
    function calculateTotalPayable() {
        const amount = parseFloat(loanAmountInput.value) || 0;
        const rate = parseFloat(interestRateInput.value) || 0;
        
        if (!loanDateInput.value || !returnDateInput.value) {
            dayCountLabel.textContent = "Số ngày vay: 0 ngày";
            totalExpectedInput.value = '';
            return 0;
        }

        const date1 = new Date(loanDateInput.value);
        const date2 = new Date(returnDateInput.value);

        if (date2 < date1) {
            dayCountLabel.textContent = "Ngày trả không hợp lệ (nhỏ hơn ngày vay)";
            totalExpectedInput.value = '';
            return 0;
        }

        // Tính khoảng cách ngày
        const diffTime = date2 - date1;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        dayCountLabel.textContent = `Số ngày vay: ${diffDays} ngày`;

        // Công thức tính lãi suất %/năm dựa trên số ngày thực tế
        const interest = amount * (rate / 100) * (diffDays / 365);
        const total = amount + interest;

        totalExpectedInput.value = formatVND(total);
        return total;
    }

    // Gắn sự kiện lắng nghe để cập nhật số tiền ngay lập tức khi người dùng nhập dữ liệu
    [loanAmountInput, interestRateInput, loanDateInput, returnDateInput].forEach(input => {
        input.addEventListener('input', calculateTotalPayable);
    });

    // Quản lý lưu trữ bằng LocalStorage
    let debtList = JSON.parse(localStorage.getItem('debtList')) || [];

    function saveAndRender() {
        localStorage.setItem('debtList', JSON.stringify(debtList));
        renderTable();
    }

    // Hiển thị danh sách ra giao diện bảng
    function renderTable() {
        const tbody = document.getElementById('debtTableBody');
        tbody.innerHTML = '';

        if (debtList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#888;">Chưa có dữ liệu ghi nợ nào.</td></tr>`;
            return;
        }

        debtList.forEach((debt, index) => {
            const tr = document.createElement('tr');
            
            // Tính lại số ngày vay để hiển thị lên bảng
            const d1 = new Date(debt.loanDate);
            const d2 = new Date(debt.returnDate);
