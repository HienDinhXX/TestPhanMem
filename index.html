<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><title>Quản lý Tài khoản & Mật khẩu</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1c1c1e;background:#fff;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:#fff;color:#1c1c1e;padding:clamp(12px,3vw,28px);font-size:15px}.app{max-width:1120px;margin:0 auto}.page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}.page-header h1{font-size:clamp(18px,2.5vw,24px);margin:0;font-weight:750}.add-btn{border:0;border-radius:12px;background:#20c4bd;color:#063f3d;font-weight:650;padding:11px 16px;min-height:42px;white-space:nowrap;cursor:pointer}.card{border:1px solid #e2e2e8;border-radius:14px;padding:14px;background:#fff;box-shadow:0 2px 10px #00000008}.search{width:100%;height:44px;border:1px solid #d8d8e0;border-radius:11px;background:#f7f7fa;padding:0 13px;font:inherit;margin-bottom:14px;outline:none}.search:focus,input:focus,textarea:focus{border-color:#20c4bd;box-shadow:0 0 0 3px #20c4bd20}.list{display:flex;flex-direction:column}.password-list-item{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:14px;padding:14px 8px;border-bottom:1px solid #e8e8ee;align-items:center}.password-list-item:last-child{border-bottom:0}.password-left,.password-right{min-width:0}.password-app{font-size:16px;font-weight:700;overflow-wrap:anywhere;margin-bottom:5px}.password-note{font-size:13px;color:#777780;overflow-wrap:anywhere;white-space:pre-wrap}.password-account,.password-value{font-size:14px;display:flex;gap:7px;align-items:flex-start;overflow-wrap:anywhere;margin:3px 0 7px}.field-icon{flex:0 0 18px;width:18px;text-align:center}.password-value-text{overflow-wrap:anywhere;word-break:break-word;letter-spacing:.5px}.password-value-row{display:flex;align-items:center;gap:5px;min-width:0}.password-eye-btn{flex:0 0 30px;width:30px;height:28px;border:0;background:transparent;color:#777780;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.password-eye-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.password-actions{display:flex;align-items:center;gap:7px;margin-top:8px}.password-action-btn{width:34px;height:34px;min-width:34px;border:1px solid #dedee6;background:#fff;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}.password-action-btn.delete{color:#ff3b30;background:#fff5f4;border-color:#ffe0dd}.password-action-btn:hover{background:#f3f3f7}.password-empty{text-align:center;padding:28px 12px;color:#888891}.password-count{font-size:13px;color:#8e8e93;padding:12px 4px 0}.modal-overlay{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:center;justify-content:center;padding:14px;overflow:auto}.modal-overlay.active{display:flex}.modal-card{width:100%;max-width:520px;background:#fff;border-radius:18px;padding:20px;box-shadow:0 18px 60px #0003;max-height:calc(100dvh - 28px);overflow:auto}.modal-card h2{font-size:21px;margin:0 0 18px}.modal-card label{display:block;font-size:13px;font-weight:650;color:#65656d;margin:0 0 6px}.modal-card input,.modal-card textarea{width:100%;min-height:44px;margin:0 0 14px;padding:11px 12px;border:1px solid #d8d8e0;border-radius:10px;background:#fff;font:inherit;font-size:16px;color:#1c1c1e;outline:none}.modal-card textarea{resize:vertical;min-height:76px}.input-wrap{position:relative;display:flex;align-items:center;margin-bottom:14px}.input-wrap input{margin:0;padding-right:48px}.password-input-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:#707078;display:flex;align-items:center;justify-content:center;cursor:pointer}.password-input-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.modal-buttons{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}.modal-buttons button{min-height:42px;padding:9px 15px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer;border:1px solid #d8d8e0;background:#fff;color:#333}.modal-buttons .save-btn{background:#20c4bd;border-color:#20c4bd;color:#063f3d}.copy-menu{position:fixed;z-index:40;min-width:170px;background:#fff;border:1px solid #e1e1e8;border-radius:12px;box-shadow:0 8px 28px #0002;padding:5px}.copy-menu button{width:100%;display:flex;gap:9px;align-items:center;padding:10px;border:0;background:#fff;border-radius:8px;text-align:left;font:inherit;cursor:pointer}.copy-menu button:hover{background:#f2f2f7}@media(max-width:520px){body{padding:12px}.page-header h1{font-size:17px}.add-btn{padding:9px 11px;font-size:14px}.card{padding:9px}.password-list-item{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px;padding:13px 3px}.password-app{font-size:14px}.password-account,.password-value{font-size:12.5px;gap:4px}.password-note{font-size:12px}.password-actions{gap:5px}.password-action-btn{width:30px;height:30px;min-width:30px;font-size:14px}.modal-card{padding:17px}.modal-card h2{font-size:19px}}
</style></head><body><main class="app">
<header class="page-header"><h1>🔐 Quản lý Tài khoản &amp; Mật khẩu</h1><button class="add-btn" type="button" onclick="openPasswordModal()">＋ Thêm Mới</button></header>
<section class="card"><input id="passwordSearchInput" class="search" type="search" placeholder="⌕  Tìm kiếm ứng dụng, tài khoản, ghi chú..." aria-label="Tìm kiếm Password" autocomplete="off" oninput="renderPasswordList()"><div id="passwordList" class="list"></div><div id="passwordCount" class="password-count"></div></section>
</main>
<div class="modal-overlay" id="passwordModal" onclick="closePasswordModalOnOverlay(event)"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle"><h2 id="passwordModalTitle">Thêm tài khoản mới</h2>
<label for="passwordAppInput">Tên ứng dụng / website *</label><input id="passwordAppInput" type="text" placeholder="Ví dụ: Gmail, Facebook" autocomplete="off">
<label for="passwordAccountInput">Tài khoản / Email *</label><input id="passwordAccountInput" type="text" placeholder="Email hoặc tên đăng nhập" autocomplete="username">
<label for="passwordValueInput">Mật khẩu *</label><div class="input-wrap"><input id="passwordValueInput" type="password" placeholder="Nhập mật khẩu" autocomplete="new-password"><button class="password-input-toggle" type="button" onclick="togglePasswordInputVisibility()" aria-label="Hiện mật khẩu" title="Hiện mật khẩu"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<label for="passwordNoteInput">Ghi chú</label><textarea id="passwordNoteInput" rows="3" placeholder="Thông tin bổ sung (không bắt buộc)"></textarea><div class="modal-buttons"><button type="button" onclick="cancelPasswordEdit()">Hủy</button><button id="passwordCancelEditButton" type="button" style="display:none" onclick="cancelPasswordEdit()">Hủy sửa</button><button id="passwordSaveButton" class="save-btn" type="button" onclick="savePasswordItem()">Lưu tài khoản</button></div></section></div>
<script>
let passwordItems=[];let editingPasswordId=null;
function escapeHTML(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function saveData(){localStorage.setItem('password_data_v1',JSON.stringify(passwordItems))}
function loadData(){try{const parsed=JSON.parse(localStorage.getItem('password_data_v1')||'[]');passwordItems=Array.isArray(parsed)?parsed:[]}catch{passwordItems=[]}renderPasswordList()}
function passwordEyeIcon(visible){return visible?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16.5 16.5 0 0 1-3.1 3.9"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>'}
function renderPasswordList(){const el=document.getElementById('passwordList');const q=(document.getElementById('passwordSearchInput').value||'').trim().toLocaleLowerCase('vi');const items=passwordItems.filter(x=>[x.app,x.account,x.note].map(v=>String(v||'')).join(' ').toLocaleLowerCase('vi').includes(q));document.getElementById('passwordCount').textContent=`Hiển thị ${items.length} trên ${passwordItems.length} tài khoản`;if(!items.length){el.innerHTML=`<div class="password-empty">${passwordItems.length?'Không tìm thấy Password phù hợp.':'Chưa có thông tin Password nào. Nhấn “＋ Thêm Mới” để bắt đầu.'}</div>`;return}el.innerHTML=items.map(item=>`<article class="password-list-item"><div class="password-left"><div class="password-app">${escapeHTML(item.app||'')}</div>${item.note?`<div class="password-note">${escapeHTML(item.note)}</div>`:''}</div><div class="password-right"><div class="password-account"><span class="field-icon">👤</span><span>${escapeHTML(item.account||'')}</span></div><div class="password-value"><span class="field-icon">🔑</span><div class="password-value-row"><span class="password-value-text" id="password-display-${item.id}" data-visible="false">••••••••</span><button type="button" class="password-eye-btn" onclick="togglePasswordVisibility(${item.id},this)" aria-label="Hiện mật khẩu" title="Hiện/ẩn mật khẩu">${passwordEyeIcon(false)}</button></div></div><div class="password-actions"><button type="button" class="password-action-btn" onclick="editPasswordItem(${item.id})" aria-label="Sửa" title="Sửa">✏️</button><button type="button" class="password-action-btn delete" onclick="deletePasswordItem(${item.id})" aria-label="Xóa" title="Xóa">🗑️</button><button type="button" class="password-action-btn" onclick="showPasswordCopyMenu(${item.id},this)" aria-label="Copy" title="Copy">📋</button></div></div></article>`).join('')}
function openPasswordModal(){clearPasswordForm();document.getElementById('passwordModalTitle').textContent='Thêm tài khoản mới';document.getElementById('passwordSaveButton').textContent='Lưu tài khoản';document.getElementById('passwordModal').classList.add('active');setTimeout(()=>document.getElementById('passwordAppInput').focus(),50)}function closePasswordModal(){document.getElementById('passwordModal').classList.remove('active')}function closePasswordModalOnOverlay(e){if(e.target.id==='passwordModal')closePasswordModal()}
function clearPasswordForm(){['passwordAppInput','passwordAccountInput','passwordValueInput','passwordNoteInput'].forEach(id=>document.getElementById(id).value='');document.getElementById('passwordValueInput').type='password';editingPasswordId=null;document.getElementById('passwordCancelEditButton').style.display='none';document.getElementById('passwordSaveButton').textContent='Lưu tài khoản';const eye=document.querySelector('.password-input-toggle');if(eye)eye.innerHTML=passwordEyeIcon(false)}
function savePasswordItem(){const app=document.getElementById('passwordAppInput').value.trim(),account=document.getElementById('passwordAccountInput').value.trim(),password=document.getElementById('passwordValueInput').value,note=document.getElementById('passwordNoteInput').value.trim();if(!app){alert('Vui lòng nhập tên ứng dụng!');document.getElementById('passwordAppInput').focus();return}if(!account){alert('Vui lòng nhập tài khoản!');document.getElementById('passwordAccountInput').focus();return}if(!password){alert('Vui lòng nhập mật khẩu!');document.getElementById('passwordValueInput').focus();return}if(editingPasswordId!==null){const i=passwordItems.findIndex(x=>x.id===editingPasswordId);if(i>=0)passwordItems[i]={...passwordItems[i],app,account,password,note}}else{passwordItems.unshift({id:Date.now(),app,account,password,note})}saveData();clearPasswordForm();closePasswordModal();renderPasswordList()}
function togglePasswordInputVisibility(){const input=document.getElementById('passwordValueInput'),button=document.querySelector('.password-input-toggle');const visible=input.type==='text';input.type=visible?'password':'text';button.innerHTML=passwordEyeIcon(!visible);button.title=visible?'Hiện mật khẩu':'Ẩn mật khẩu';button.setAttribute('aria-label',button.title)}
function togglePasswordVisibility(id,button){const item=passwordItems.find(x=>x.id===id),display=document.getElementById(`password-display-${id}`);if(!item||!display)return;const visible=display.dataset.visible==='true';display.textContent=visible?'••••••••':(item.password||'');display.dataset.visible=visible?'false':'true';button.innerHTML=passwordEyeIcon(!visible);button.title=visible?'Hiện mật khẩu':'Ẩn mật khẩu';button.setAttribute('aria-label',button.title)}
function showPasswordCopyMenu(id,button){document.querySelectorAll('.copy-menu').forEach(x=>x.remove());const item=passwordItems.find(x=>x.id===id),display=document.getElementById(`password-display-${id}`);if(!item||!display)return;const menu=document.createElement('div');menu.className='copy-menu';menu.innerHTML=`<button type="button" onclick="copyPasswordAccount(${id});this.closest('.copy-menu').remove()"><span>👤</span><span>Copy tài khoản</span></button>`;if(display.dataset.visible==='true')menu.insertAdjacentHTML('beforeend',`<button type="button" onclick="copyPasswordField(${id});this.closest('.copy-menu').remove()"><span>🔑</span><span>Copy mật khẩu</span></button>`);document.body.appendChild(menu);const r=button.getBoundingClientRect(),m=menu.getBoundingClientRect(),gap=8;let left=Math.max(gap,Math.min(r.right-m.width,innerWidth-m.width-gap)),top=r.bottom+6;if(top+m.height>innerHeight-gap)top=r.top-m.height-6;menu.style.left=left+'px';menu.style.top=Math.max(gap,Math.min(top,innerHeight-m.height-gap))+'px';const close=e=>{if(!menu.contains(e.target)&&e.target!==button){menu.remove();document.removeEventListener('pointerdown',close,true)}};setTimeout(()=>document.addEventListener('pointerdown',close,true),0)}
async function copyPasswordAccount(id){const item=passwordItems.find(x=>x.id===id);if(item)await copyPasswordText(item.account||'','Tài khoản')}async function copyPasswordField(id){const item=passwordItems.find(x=>x.id===id),display=document.getElementById(`password-display-${id}`);if(!item||!display||display.dataset.visible!=='true'){alert('Vui lòng bấm nút mắt để hiện mật khẩu trước.');return}await copyPasswordText(item.password||'','Mật khẩu')}async function copyPasswordText(value,label){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;t.readOnly=true;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy failed')}}catch(e){alert('Không thể copy tự động. Vui lòng thử lại trên HTTPS hoặc trình duyệt hỗ trợ clipboard.')}}
function editPasswordItem(id){const item=passwordItems.find(x=>x.id===id);if(!item)return;editingPasswordId=id;document.getElementById('passwordAppInput').value=item.app||'';document.getElementById('passwordAccountInput').value=item.account||'';document.getElementById('passwordValueInput').value=item.password||'';document.getElementById('passwordNoteInput').value=item.note||'';document.getElementById('passwordModalTitle').textContent='Sửa tài khoản';document.getElementById('passwordSaveButton').textContent='Lưu thay đổi';document.getElementById('passwordCancelEditButton').style.display='inline-block';document.getElementById('passwordModal').classList.add('active')}
function cancelPasswordEdit(){clearPasswordForm();closePasswordModal()}function deletePasswordItem(id){const item=passwordItems.find(x=>x.id===id);if(!item)return;if(confirm(`Xóa Password của "${item.app}"?`)){passwordItems=passwordItems.filter(x=>x.id!==id);if(editingPasswordId===id)clearPasswordForm();saveData();renderPasswordList()}}
loadData();
</script></body></html>
