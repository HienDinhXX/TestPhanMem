<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Chụp & Đóng Dấu Ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button, label.btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover, label.btn:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        .controls {
            margin: 15px 0;
            text-align: left;
        }
        .controls label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .canvas-container {
            margin-top: 15px;
            position: relative;
            width: 100%;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: none;
        }
        .download-btn {
            background-color: #28a745;
            margin-top: 15px;
            display: none;
            width: 100%;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ứng dụng Đóng Dấu Ảnh</h2>

    <!-- 1 nút tải ảnh từ máy, 1 nút chụp ảnh trực tiếp -->
    <div class="btn-group">
        <label for="uploadInput" class="btn">Tải ảnh từ máy</label>
        <input type="file" id="uploadInput" accept="image/*">

        <label for="cameraInput" class="btn">Chụp ảnh trực tiếp</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <!-- Chọn kiểu thêm (vị trí hiển thị watermark) -->
    <div class="controls">
        <label for="styleSelect">Chọn kiểu thêm dấu (Vị trí):</label>
        <select id="styleSelect" onchange="redrawCanvas()">
            <option value="bottom-left">Dưới cùng - Bên trái</option>
            <option value="bottom-right">Dưới cùng - Bên phải</option>
            <option value="top-left">Trên cùng - Bên trái</option>
            <option value="top-right">Trên cùng - Bên phải</option>
        </select>
    </div>

    <!-- Canvas hiển thị ảnh đã thêm hoặc chụp -->
    <div class="canvas-container">
        <canvas id="photoCanvas"></canvas>
    </div>

    <!-- 1 nút tải xuống -->
    <button id="downloadBtn" class="download-btn" onclick="downloadImage()">Tải xuống ảnh</button>
</div>

<script>
    const uploadInput = document.getElementById('uploadInput');
    const cameraInput = document.getElementById('cameraInput');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    const styleSelect = document.getElementById('styleSelect');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;
    let currentLocationText = 'Đang lấy vị trí...';

    // Lấy thông tin GPS (Vị trí)
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                currentLocationText = `Lat: ${lat}, Lon: ${lon}`;
                if (currentImg) redrawCanvas();
            },
            () => {
                currentLocationText = 'Không lấy được vị trí';
                if (currentImg) redrawCanvas();
            }
        );
    } else {
        currentLocationText = 'GPS không được hỗ trợ';
    }

    function handleImageLoad(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentImg = img;
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.display = 'block';
                downloadBtn.style.display = 'block';
                redrawCanvas();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    uploadInput.addEventListener('change', handleImageLoad);
    cameraInput.addEventListener('change', handleImageLoad);

    function redrawCanvas() {
        if (!currentImg) return;

        // Vẽ lại ảnh gốc
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);

        // Chuẩn bị nội dung dấu (mark)
        const now = new Date();
        const timeStr = now.toLocaleTimeString('vi-VN');
        const dateStr = now.toLocaleDateString('vi-VN');
        const fullText = `📍 ${timeStr} - ${dateStr} - ${currentLocationText}`;

        // Cấu hình font chữ tương ứng với kích thước ảnh
        const fontSize = Math.max(16, Math.floor(canvas.width / 35));
        ctx.font = `bold ${fontSize}px Arial`;
        const textMetrics = ctx.measureText(fullText);
        const textWidth = textMetrics.width;
        const textHeight = fontSize;

        const padding = fontSize * 0.6;
        const style = styleSelect.value;

        let x = padding;
        let y = canvas.height - padding - textHeight;

        if (style === 'bottom-left') {
            x = padding;
            y = canvas.height - padding;
        } else if (style === 'bottom-right') {
            x = canvas.width - textWidth - padding * 2;
            y = canvas.height - padding;
        } else if (style === 'top-left') {
            x = padding;
            y = textHeight + padding;
        } else if (style === 'top-right') {
            x = canvas.width - textWidth - padding * 2;
            y = textHeight + padding;
        }

        // Vẽ nền chữ cho dễ đọc
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(x - padding/2, y - textHeight - padding/2, textWidth + padding, textHeight + padding);

        // Vẽ chữ và biểu tượng định vị
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(fullText, x, y);
    }

    function downloadImage() {
        if (!currentImg) return;
        const link = document.createElement('a');
        link.download = 'anh-da-dong-dau.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
