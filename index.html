<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Quản Lý Ghi Nợ</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --background-color: #f3f4f6;
            --card-color: #ffffff;
            --text-color: #1f2937;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        .card {
            background: var(--card-color);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        input:readonly {
            background-color: #e9ecef;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #4338ca;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8fafc;
            color: var(--primary-color);
        }

        .btn-delete {
            background-color: #ef4444;
            padding: 5px 10px;
            font-size: 14px;
        }
        .btn-delete:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Quản Lý Khoản Cho Vay</h1>
    
    <div class="grid">
        <!-- FORM NHẬP THÔNG TIN -->
        <div class="card">
            <h2>Thêm Khoản Nợ Mới</h2>
            <form id="debtForm">
                <div class="form-group">
                    <label for="borrowerName">Tên người vay:</label>
                    <input type="text" id="borrowerName" required placeholder="Ví dụ: Nguyễn Văn A">
                </div>
                
                <div class="form-group">
                    <label for="loanAmount">Số tiền vay (VNĐ):</label>
                    <input type="number" id="loanAmount" required placeholder="Ví dụ: 10000000">
                </div>

                <div class="form-group">
                    <label for="interestRate">Lãi suất (% / năm):</label>
                    <input type="number" id="interestRate" step="0.1" required placeholder="Ví dụ: 5.5">
                </div>

                <div class="form-group">
                    <label for="loanDate">Ngày vay:</label>
                    <input type="date" id="loanDate" required>
                </div>

                <div class="form-group">
                    <label for="returnDate">Ngày dự kiến trả:</label>
                    <input type="date" id="returnDate" required>
                </div>

                <div class="form-group">
                    <label for="totalExpected">Tổng số tiền dự kiến trả:</label>
                    <input type="text" id="totalExpected" readonly placeholder="Tự động tính toán...">
                </div>

                <button type="submit">Thêm Vào Sổ Nợ</button>
            </form>
        </div>

        <!-- DANH SÁCH SỔ NỢ -->
        <div class="card">
            <h2>Danh Sách Nợ</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Người vay</th>
                            <th>Ngày vay</th>
                            <th>Số tiền gốc</th>
                            <th>Lãi suất</th>
                            <th>Hạn trả</th>
                            <th>Tổng dự kiến</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="debtTableBody">
                        <!-- Dữ liệu sẽ tự động render ở đây -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // Hàm định dạng tiền tệ VND
    function formatVND(amount) {
        return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
    }

    // Tự động tính toán tổng số tiền dự kiến trả khi có thay đổi thông tin đầu vào
    const loanAmountInput = document.getElementById('loanAmount');
    const interestRateInput = document.getElementById('interestRate');
    const loanDateInput = document.getElementById('loanDate');
    const returnDateInput = document.getElementById('returnDate');
    const totalExpectedInput = document.getElementById('totalExpected');

    function calculateTotalPayable() {
        const amount = parseFloat(loanAmountInput.value) || 0;
        const rate = parseFloat(interestRateInput.value) || 0;
        const date1 = new Date(loanDateInput.value);
        const date2 = new Date(returnDateInput.value);

        if (amount > 0 && loanDateInput.value && returnDateInput.value && date2 >= date1) {
            // Tính số ngày vay thực tế
            const diffTime = Math.abs(date2 - date1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // Công thức tính lãi đơn theo số ngày: Gốc + (Gốc * Lãi suất/năm * Số ngày / 365)
            const interest = amount * (rate / 100) * (diffDays / 365);
            const total = amount + interest;

            totalExpectedInput.value = formatVND(total);
            return total;
        } else {
            totalExpectedInput.value = '';
            return 0;
        }
    }

    // Đăng ký sự kiện thay đổi dữ liệu để tính lại tiền tự động
    [loanAmountInput, interestRateInput, loanDateInput, returnDateInput].forEach(input => {
        input.addEventListener('input', calculateTotalPayable);
    });

    // Quản lý dữ liệu bằng LocalStorage (để tắt trình duyệt đi bật lại không bị mất dữ liệu)
    let debtList = JSON.parse(localStorage.getItem('debtList')) || [];

    function saveAndRender() {
        localStorage.setItem('debtList', JSON.stringify(debtList));
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('debtTableBody');
        tbody.innerHTML = '';

        if (debtList.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#888;">Chưa có dữ liệu ghi nợ nào.</td></tr>`;
            return;
        }

        debtList.forEach((debt, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${debt.name}</strong></td>
                <td>${debt.loanDate}</td>
                <td>${formatVND(debt.amount)}</td>
                <td>${debt.rate}%/năm</td>
                <td>${debt.returnDate}</td>
                <td style="color: #4f46e5; font-weight: bold;">${formatVND(debt.total)}</td>
                <td><button class="btn-delete" onclick="deleteDebt(${index})">Xóa</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Thêm khoản nợ mới
    document.getElementById('debtForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const totalPayable = calculateTotalPayable();
        if (totalPayable === 0) {
            alert('Vui lòng kiểm tra lại thông tin ngày dự kiến trả phải lớn hơn hoặc bằng ngày vay.');
            return;
        }

        const newDebt = {
            name: document.getElementById('borrowerName').value,
            amount: parseFloat(loanAmountInput.value),
            rate: parseFloat(interestRateInput.value),
            loanDate: loanDateInput.value,
            returnDate: returnDateInput.value,
            total: totalPayable
        };

        debtList.push(newDebt);
        saveAndRender();
        
        // Reset form nhập
        this.reset();
        totalExpectedInput.value = '';
    });

    // Xóa khoản nợ
    function deleteDebt(index) {
        if(confirm('Bạn có chắc chắn muốn xóa dòng ghi nợ này không?')) {
            debtList.splice(index, 1);
            saveAndRender();
        }
    }

    // Chạy render lần đầu khi tải trang
    renderTable();
</script>

</body>
</html>
