<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Đóng Dấu Ảnh</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 550px; width: 100%; text-align: center; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        button, label.btn { background-color: #007bff; color: white; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; }
        input[type="file"] { display: none; }
        .controls { margin: 20px 0; text-align: left; }
        .form-row { display: flex; align-items: center; margin-bottom: 12px; }
        .form-label { flex: 0 0 35%; font-weight: bold; font-size: 14px; color: #333; }
        .form-input { flex: 0 0 65%; box-sizing: border-box; }
        input[type="text"], input[type="time"], input[type="date"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        .zoom-container { display: flex; align-items: center; width: 100%; gap: 10px; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .zoom-value { font-size: 14px; font-weight: bold; min-width: 35px; text-align: right; }
        canvas { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #ddd; display: none; margin-top: 15px; }
        .download-btn { background-color: #28a745; margin-top: 15px; display: none; width: 100%; }
    </style>
</head>
<body>
<div class="container">
    <h2>Ứng dụng Đóng Dấu Ảnh</h2>
    <div class="btn-group">
        <label for="uploadInput" class="btn">Tải ảnh từ máy</label>
        <input type="file" id="uploadInput" accept="image/*">
        <label for="cameraInput" class="btn">Chụp ảnh trực tiếp</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>
    <div class="controls">
        <div class="form-row"><div class="form-label">Vị trí:</div><div class="form-input"><input type="text" id="locationInput" value="Hà Nội"></div></div>
        <div class="form-row"><div class="form-label">Thời gian:</div><div class="form-input"><input type="time" id="timeInput"></div></div>
        <div class="form-row"><div class="form-label">Ngày tháng:</div><div class="form-input"><input type="date" id="dateInput"></div></div>
        <div class="form-row"><div class="form-label">Vị trí hiển thị:</div><div class="form-input"><select id="styleSelect"><option value="bottom-left">Dưới cùng - Bên trái</option><option value="bottom-right">Dưới cùng - Bên phải</option><option value="top-left">Trên cùng - Bên trái</option><option value="top-right">Trên cùng - Bên phải</option></select></div></div>
        <div class="form-row"><div class="form-label">Kích thước (Zoom):</div><div class="form-input zoom-container"><input type="range" id="zoomInput" min="10" max="100" value="30"><span id="zoomValue" class="zoom-value">30px</span></div></div>
    </div>
    <canvas id="photoCanvas"></canvas>
    <button id="downloadBtn" class="download-btn" onclick="downloadImage()">Tải xuống ảnh</button>
</div>
<script>
    const uploadInput = document.getElementById('uploadInput'), cameraInput = document.getElementById('cameraInput');
    const canvas = document.getElementById('photoCanvas'), ctx = canvas.getContext('2d');
    const locationInput = document.getElementById('locationInput'), timeInput = document.getElementById('timeInput'), dateInput = document.getElementById('dateInput');
    const styleSelect = document.getElementById('styleSelect'), zoomInput = document.getElementById('zoomInput'), zoomValue = document.getElementById('zoomValue'), downloadBtn = document.getElementById('downloadBtn');
    let currentImg = null;

    const now = new Date();
    timeInput.value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    dateInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

    [locationInput, timeInput, dateInput, styleSelect].forEach(el => el.addEventListener('input', redrawCanvas));
    styleSelect.addEventListener('change', redrawCanvas);
    zoomInput.addEventListener('input', () => { zoomValue.innerText = zoomInput.value + 'px'; redrawCanvas(); });

    function handleImageLoad(e) {
        if (!e.target.files[0]) return;
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentImg = img; canvas.width = img.width; canvas.height = img.height;
                const defZoom = Math.max(16, Math.floor(img.width / 35));
                zoomInput.max = Math.max(200, Math.floor(img.width / 10)); zoomInput.value = defZoom; zoomValue.innerText = defZoom + 'px';
                canvas.style.display = 'block'; downloadBtn.style.display = 'block'; redrawCanvas();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(e.target.files[0]);
    }
    uploadInput.addEventListener('change', handleImageLoad);
    cameraInput.addEventListener('change', handleImageLoad);

    function redrawCanvas() {
        if (!currentImg) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);
        let dateStr = '';
        if (dateInput.value) { const [y, m, d] = dateInput.value.split('-'); dateStr = `${d}/${m}/${y}`; }
        const fullText = `📍 ${timeInput.value || '--:--'} - ${dateStr} ${locationInput.value ? '- ' + locationInput.value : ''}`;
        const fontSize = parseInt(zoomInput.value);
        ctx.font = `bold ${fontSize}px Arial`;
        const textMetrics = ctx.measureText(fullText), textWidth = textMetrics.width, textHeight = fontSize, padding = fontSize * 0.6;
        let x = padding, y = canvas.height - padding;
        if (styleSelect.value === 'bottom-right') { x = canvas.width - textWidth - padding * 2; }
        else if (styleSelect.value === 'top-left') { y = textHeight + padding; }
        else if (styleSelect.value === 'top-right') { x = canvas.width - textWidth - padding * 2; y = textHeight + padding; }
        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(x - padding/2, y - textHeight - padding/2, textWidth + padding, textHeight + padding);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(fullText, x, y);
    }
    function downloadImage() {
        if (!currentImg) return;
        const link = document.createElement('a'); link.download = `anh_${Date.now()}.png`; link.href = canvas.toDataURL('image/png'); link.click();
    }
</script>
</body>
</html>
