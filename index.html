<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Chụp & Đóng Dấu Ảnh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button, label.btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover, label.btn:hover {
            background-color: #0056b3;
        }
        input[type="file"] {
            display: none;
        }
        .controls {
            margin: 15px 0;
            text-align: left;
        }
        .controls label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        .canvas-container {
            margin-top: 15px;
            position: relative;
            width: 100%;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: none;
        }
        .download-btn {
            background-color: #28a745;
            margin-top: 15px;
            display: none;
            width: 100%;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        .status-gps {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ứng dụng Đóng Dấu Ảnh</h2>
    
    <!-- Hiển thị tình trạng GPS để người dùng biết lý do lỗi -->
    <div id="gpsStatus" class="status-gps">Đang yêu cầu quyền truy cập GPS...</div>

    <div class="btn-group">
        <label for="uploadInput" class="btn">Tải ảnh từ máy</label>
        <input type="file" id="uploadInput" accept="image/*">

        <label for="cameraInput" class="btn">Chụp ảnh trực tiếp</label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment">
    </div>

    <div class="controls">
        <label for="styleSelect">Chọn kiểu thêm dấu (Vị trí):</label>
        <select id="styleSelect" onchange="redrawCanvas()">
            <option value="bottom-left">Dưới cùng - Bên trái</option>
            <option value="bottom-right">Dưới cùng - Bên phải</option>
            <option value="top-left">Trên cùng - Bên trái</option>
            <option value="top-right">Trên cùng - Bên phải</option>
        </select>
    </div>

    <div class="canvas-container">
        <canvas id="photoCanvas"></canvas>
    </div>

    <button id="downloadBtn" class="download-btn" onclick="downloadImage()">Tải xuống ảnh</button>
</div>

<script>
    const uploadInput = document.getElementById('uploadInput');
    const cameraInput = document.getElementById('cameraInput');
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d');
    const styleSelect = document.getElementById('styleSelect');
    const downloadBtn = document.getElementById('downloadBtn');
    const gpsStatus = document.getElementById('gpsStatus');

    let currentImg = null;
    let currentLocationText = 'Đang lấy vị trí...';

    // Hàm lấy GPS chuẩn hóa có xử lý lỗi chi tiết
    function getGPSLocation() {
        if (!navigator.geolocation) {
            currentLocationText = 'GPS không được hỗ trợ';
            gpsStatus.innerText = 'Lỗi: Trình duyệt của bạn không hỗ trợ Geolocation API.';
            return;
        }

        // Kiểm tra nếu chạy file trực tiếp không qua HTTPS/Localhost
        if (window.location.protocol === 'file:') {
            currentLocationText = 'Lỗi bảo mật (Chạy file://)';
            gpsStatus.innerHTML = '<span style="color: red;">Lỗi bảo mật: Bạn cần chạy ứng dụng qua mạng (HTTPS) hoặc localhost để sử dụng GPS.</span>';
            return;
        }

        const options = {
            enableHighAccuracy: true, // Yêu cầu độ chính xác cao
            timeout: 8000,            // Chờ tối đa 8 giây
            maximumAge: 0             // Không dùng vị trí cũ lưu trong bộ nhớ đệm
        };

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(5);
                const lon = position.coords.longitude.toFixed(5);
                currentLocationText = `Lat: ${lat}, Lon: ${lon}`;
                gpsStatus.innerHTML = `<span style="color: green;">✓ Đã kết nối GPS thành công! (${currentLocationText})</span>`;
                if (currentImg) redrawCanvas();
            },
            (error) => {
                switch(error.code) {
                    case error.PERMISSION_DENIED:
                        currentLocationText = 'Từ chối quyền GPS';
                        gpsStatus.innerText = 'Lỗi: Bạn đã từ chối cấp quyền truy cập vị trí. Hãy bật lại trong cài đặt trình duyệt.';
                        break;
                    case error.POSITION_UNAVAILABLE:
                        currentLocationText = 'Vị trí không có sẵn';
                        gpsStatus.innerText = 'Lỗi: Thiết bị không thể xác định được vị trí (sóng yếu hoặc tắt định vị máy).';
                        break;
                    case error.TIMEOUT:
                        currentLocationText = 'Hết thời gian chờ GPS';
                        gpsStatus.innerText = 'Lỗi: Quá thời gian phản hồi từ GPS. Hãy thử lại.';
                        break;
                    default:
                        currentLocationText = 'Lỗi GPS chưa xác định';
                        gpsStatus.innerText = 'Không lấy được vị trí.';
                }
                if (currentImg) redrawCanvas();
            },
            options
        );
    }

    // Gọi hàm lấy vị trí ngay khi ứng dụng mở ra
    getGPSLocation();

    function handleImageLoad(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                currentImg = img;
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.display = 'block';
                downloadBtn.style.display = 'block';
                redrawCanvas();
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    uploadInput.addEventListener('change', handleImageLoad);
    cameraInput.addEventListener('change', handleImageLoad);

    function redrawCanvas() {
        if (!currentImg) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);

        const now = new Date();
        const timeStr = now.toLocaleTimeString('vi-VN');
        const dateStr = now.toLocaleDateString('vi-VN');
        const fullText = `📍 ${timeStr} - ${dateStr} - ${currentLocationText}`;

        const fontSize = Math.max(16, Math.floor(canvas.width / 35));
        ctx.font = `bold ${fontSize}px Arial`;
        const textMetrics = ctx.measureText(fullText);
        const textWidth = textMetrics.width;
        const textHeight = fontSize;

        const padding = fontSize * 0.6;
        const style = styleSelect.value;

        let x = padding;
        let y = canvas.height - padding - textHeight;

        if (style === 'bottom-left') {
            x = padding;
            y = canvas.height - padding;
        } else if (style === 'bottom-right') {
            x = canvas.width - textWidth - padding * 2;
            y = canvas.height - padding;
        } else if (style === 'top-left') {
            x = padding;
            y = textHeight + padding;
        } else if (style === 'top-right') {
            x = canvas.width - textWidth - padding * 2;
            y = textHeight + padding;
        }

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(x - padding/2, y - textHeight - padding/2, textWidth + padding, textHeight + padding);

        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(fullText, x, y);
    }

    function downloadImage() {
        if (!currentImg) return;
        const link = document.createElement('a');
        link.download = `anh_dong_dau_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
