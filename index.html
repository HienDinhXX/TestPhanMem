<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Ghi Nợ</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 992px) {
            .grid { grid-template-columns: 1fr 2.5fr; }
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[readonly] {
            background: #e9ecef;
            color: var(--primary);
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8fafc;
            color: var(--primary);
        }
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-unpaid { background: #fee2e2; color: #ef4444; }
        .badge-paid { background: #dcfce7; color: #22c55e; }
        .flex-btns {
            display: flex;
            gap: 5px;
        }
        .btn-sm {
            padding: 6px 10px;
            font-size: 12px;
            width: auto;
        }
        .btn-status { background: #0ea5e9; }
        .btn-delete { background: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 Sổ Ghi Nợ Thông Minh</h1>
    <div class="grid">
        <div class="card">
            <h2>Thêm Khoản Nợ</h2>
            <form id="debtForm">
                <div class="form-group">
                    <label>Tên người vay:</label>
                    <input type="text" id="borrowerName" required>
                </div>
                <div class="form-group">
                    <label>Số tiền vay (VNĐ):</label>
                    <input type="number" id="loanAmount" required>
                </div>
                <div class="form-group">
                    <label>Lãi suất (%/năm):</label>
                    <input type="number" id="interestRate" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Ngày vay:</label>
                    <input type="date" id="loanDate" required>
                </div>
                <div class="form-group">
                    <label>Ngày dự kiến trả:</label>
                    <input type="date" id="returnDate" required>
                </div>
                <div class="form-group">
                    <label>Tổng dự kiến trả:</label>
                    <input type="text" id="totalExpected" readonly>
                </div>
                <button type="submit">Thêm Vào Sổ Nợ</button>
            </form>
        </div>

        <div class="card">
            <h2>Danh Sách Công Nợ</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Người vay</th>
                            <th>Ngày vay</th>
                            <th>Gốc</th>
                            <th>Lãi suất</th>
                            <th>Hạn trả</th>
                            <th>Tổng trả</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="debtTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const formatVND = num => new Intl.NumberFormat('vi-VN', {
        style: 'currency', currency: 'VND'
    }).format(num);

    const loanAmountInput = document.getElementById('loanAmount');
    const interestRateInput = document.getElementById('interestRate');
    const loanDateInput = document.getElementById('loanDate');
    const returnDateInput = document.getElementById('returnDate');
    const totalExpectedInput = document.getElementById('totalExpected');

    function calculateTotalPayable() {
        const amount = parseFloat(loanAmountInput.value) || 0;
        const rate = parseFloat(interestRateInput.value) || 0;
        const d1 = new Date(loanDateInput.value);
        const d2 = new Date(returnDateInput.value);

        if (amount > 0 && loanDateInput.value && returnDateInput.value && d2 >= d1) {
            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const interest = amount * (rate / 100) * (diffDays / 365);
            const total = amount + interest;
            totalExpectedInput.value = formatVND(total);
            return total;
        }
        totalExpectedInput.value = '';
        return 0;
    }

    [loanAmountInput, interestRateInput, loanDateInput, returnDateInput].forEach(el => {
        el.addEventListener('input', calculateTotalPayable);
    });

    let debtList = JSON.parse(localStorage.getItem('debtList')) || [];

    function saveAndRender() {
        localStorage.setItem('debtList', JSON.stringify(debtList));
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('debtTableBody');
        tbody.innerHTML = '';
        if (debtList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#888;">Chưa có dữ liệu.</td></tr>';
            return;
        }
        debtList.forEach((debt, index) => {
            const tr = document.createElement('tr');
            const isPaid = debt.status === 'paid';
            const badge = isPaid ? '<span class="badge badge-paid">Đã trả</span>' : '<span class="badge badge-unpaid">Chưa trả</span>';
            const btnText = isPaid ? 'Chưa trả' : 'Đã trả';
            
            tr.innerHTML = `
                <td><strong>${debt.name}</strong></td>
                <td>${debt.loanDate}</td>
                <td>${formatVND(debt.amount)}</td>
                <td>${debt.rate}%</td>
                <td>${debt.returnDate}</td>
                <td style="color:#4f46e5;font-weight:bold;">${formatVND(debt.total)}</td>
                <td>${badge}</td>
                <td>
                    <div class="flex-btns">
                        <button class="btn-sm btn-status" onclick="toggleStatus(${index})">${btnText}</button>
                        <button class="btn-sm btn-delete" onclick="deleteDebt(${index})">Xóa</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('debtForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const totalPayable = calculateTotalPayable();
        if (totalPayable === 0) {
            alert('Ngày dự kiến trả phải lớn hơn hoặc bằng ngày vay.');
            return;
        }
        const newDebt = {
            name: document.getElementById('borrowerName').value,
            amount: parseFloat(loanAmountInput.value),
            rate: parseFloat(interestRateInput.value),
            loanDate: loanDateInput.value,
            returnDate: returnDateInput.value,
            total: totalPayable,
            status: 'unpaid'
        };
        debtList.push(newDebt);
        saveAndRender();
        this.reset();
        totalExpectedInput.value = '';
    });

    function toggleStatus(index) {
        debtList[index].status = debtList[index].status === 'paid' ? 'unpaid' : 'paid';
        saveAndRender();
    }

    function deleteDebt(index) {
        if (confirm('Bạn có chắc chắn muốn xóa không?')) {
            debtList.splice(index, 1);
            saveAndRender();
        }
    }

    renderTable();
</script>

</body>
</html>
